name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit:deps

      - name: Build workspace
        run: pnpm build

      - name: Run TypeScript tests
        run: pnpm test:ts

      - name: Check formatting
        run: npx prettier --check 'packages/*/src/**/*.{ts,json,md}'

  casper-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust (nightly for Odra bulk-memory-disabled WASM)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-01-01

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/contracts-casper/target
          key: ${{ runner.os }}-cargo-casper-${{ hashFiles('packages/contracts-casper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-casper-

      - name: Install cargo-odra
        run: cargo install cargo-odra --locked

      - name: Run Casper (Odra) unit tests
        run: PATH="$HOME/.cargo/bin:$PATH" cargo odra test
        working-directory: packages/contracts-casper

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Casper contract dependencies
        run: cargo audit
        working-directory: packages/contracts-casper
