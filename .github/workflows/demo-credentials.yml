name: Demo credentials

# Read-only isCapable checks against live /gate samples.
# Fails when a GO sample expires or a revoked fixture is accidentally re-issued.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "web/lib/demo-subjects.ts"
      - "scripts/smoke-demo-credentials.ts"
      - "assets/credentials.example.json"
      - "assets/networks.json"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ligis/core --filter @ligis/adapter-evm --filter @ligis/adapter-casper run build
      - name: Smoke demo credentials (Pharos + Monad + Casper)
        run: pnpm smoke:demo-credentials
        env:
          # Public Casper Testnet read config (no secrets — same values as
          # .env.d/casper.env, which the script loads locally when present).
          LIGIS_CASPER_RPC_URL: https://node.testnet.casper.network/rpc
          LIGIS_CASPER_NETWORK: testnet
          LIGIS_CASPER_AGENT_ID: contract-package-d8b79439bf227b255f478242c3398dd8a8dbd2ad8a8d47ef6281fc8f3c634ac1
          LIGIS_CASPER_CREDENTIAL_REGISTRY: contract-package-6edde3cf38a6ff3f74c3fb1f7512b36c641a911d1494742efc10ef711262aa37
          LIGIS_CASPER_DEPLOYER_ACCOUNT_HASH: account-hash-c76927ed08eb9a3a2cca7ee0b730fb4cefa22551d3e5914e4d44d693762a8326
          LIGIS_CASPER_DEPLOYER_EVM_ADDRESS: "0x5288665a4a64cc2f6d74c16adafa59e65aa81afd"
