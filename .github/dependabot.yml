version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Version updates stay ON. The `pnpm.overrides` entries in package.json are
    # security *floors* (`>=`), not pins, so Dependabot proposing a newer
    # version is legitimate work and must not be suppressed.
    #
    # What is ignored is one specific advisory that Dependabot cannot resolve:
    # it is a client-side transitive of wallet-connector SDKs, not in
    # our dependency surface, and the upstream ranges make no fix reachable.
    # It remains an open, dismissed-by-policy alert — not a fixed one.
    #
    # ⚠️ This list is MIRRORED in scripts/security-audit.mjs (DISMISSED), which
    # enforces the high/critical floor in CI. Add an ignore here and the same
    # GHSAs there, or CI will block on the dismissed advisory.
    #
    # dependabot.yml cannot ignore a single advisory (an `advisory-id` key
    # makes the whole file invalid and stops Dependabot), so the entry ignores
    # the dependency and the GHSA it stands for is recorded in the comment.
    ignore:
      # uuid: missing buffer bounds check in v3/v5/v6 when `buf` is provided.
      # Pinned to ^8 by @metamask/sdk (via @gemini-wallet/core -> wagmi
      # connectors). We call uuid.v4 only; the advisory needs v3/v5/v6 with an
      # explicit buffer. Forcing >=14 across six majors of a wallet SDK is a
      # worse risk than the advisory. Dismissed advisory: GHSA-w5hq-g745-h8pq.
      - dependency-name: "uuid"
  - package-ecosystem: "cargo"
    directory: "/packages/contracts-casper"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
