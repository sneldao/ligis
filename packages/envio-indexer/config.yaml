# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Ligis CredentialRegistry indexer — Monad Testnet (free Envio HyperIndex path).
#
# Setup (free):
#   1. pnpm --filter @ligis/envio-indexer install
#   2. Create a free API token at https://app.envio.dev/api-tokens
#   3. export ENVIO_API_TOKEN=...
#   4. pnpm --filter @ligis/envio-indexer codegen && pnpm --filter @ligis/envio-indexer dev
#   5. Point the web app at the GraphQL endpoint:
#        LIGIS_ENVIO_GRAPHQL_URL=http://localhost:8080/v1/graphql
#      Or deploy to Envio Cloud and use the hosted URL (Metropolis free tier).
name: ligis-credential-registry
description: Indexes Ligis CredentialRegistry issue/revoke/capability events on Monad Testnet
# Match web/lib/envio.ts subject/issuer filters (lowercase hex).
address_format: lowercase
contracts:
  - name: CredentialRegistry
    handler: src/EventHandlers.ts
    events:
      - event: CredentialIssued(address indexed issuer, address indexed subject, bytes32 indexed capabilityHash, uint256 nonce, uint64 issuedAt, uint64 expiresAt)
      - event: CredentialRevoked(address indexed issuer, address indexed subject, bytes32 indexed capabilityHash, uint256 nonce, uint64 revokedAt)
      - event: AgentCapabilityChanged(address indexed subject, bytes32 indexed capabilityHash, bool capable)
chains:
  - id: 10143 # Monad Testnet — HyperSync-backed, no paid RPC required
    start_block: 63359400 # just before Ligis deploy (AgentId @ 63359413)
    contracts:
      - name: CredentialRegistry
        # v2 registry (ERC-1271 issuer path), deployed 2026-10-01.
        address: "0xf589013b0D41efBdb25b8BDF98c83d676B02aF5a"
