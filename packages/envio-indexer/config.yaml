# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Ligis CredentialRegistry indexer — Monad Testnet (free Envio HyperIndex path).
#
# Setup (free):
#   1. pnpm --filter @ligis/envio-indexer install
#   2. Create a free API token at https://app.envio.dev/api-tokens
#   3. export ENVIO_API_TOKEN=...
#   4. pnpm --filter @ligis/envio-indexer codegen && pnpm --filter @ligis/envio-indexer dev
#   5. Point the web app at the GraphQL endpoint:
#        LIGIS_ENVIO_GRAPHQL_URL=http://localhost:8080/v1/graphql
#      Or deploy to Envio Cloud and use the hosted URL (Metropolis free tier).
name: ligis-credential-registry
description: Indexes Ligis credentials and standard ERC-8004 identity/wallet/reputation events on Monad Testnet
# Match web/lib/envio.ts subject/issuer filters (lowercase hex).
address_format: lowercase
contracts:
  - name: CredentialRegistry
    handler: src/EventHandlers.ts
    events:
      - event: CredentialIssued(address indexed issuer, address indexed subject, bytes32 indexed capabilityHash, uint256 nonce, uint64 issuedAt, uint64 expiresAt)
      - event: CredentialRevoked(address indexed issuer, address indexed subject, bytes32 indexed capabilityHash, uint256 nonce, uint64 revokedAt)
      - event: AgentCapabilityChanged(address indexed subject, bytes32 indexed capabilityHash, bool capable)
  - name: IdentityRegistry
    handler: src/EventHandlers.ts
    events:
      - event: Registered(uint256 indexed agentId, string agentURI, address indexed owner)
      - event: MetadataSet(uint256 indexed agentId, string indexed indexedMetadataKey, string metadataKey, bytes metadataValue)
      - event: URIUpdated(uint256 indexed agentId, string newURI, address indexed updatedBy)
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
  - name: ReputationRegistry
    handler: src/EventHandlers.ts
    events:
      - event: NewFeedback(uint256 indexed agentId, address indexed clientAddress, uint64 feedbackIndex, int128 value, uint8 valueDecimals, string indexed indexedTag1, string tag1, string tag2, string endpoint, string feedbackURI, bytes32 feedbackHash)
      - event: FeedbackRevoked(uint256 indexed agentId, address indexed clientAddress, uint64 indexed feedbackIndex)
      - event: ResponseAppended(uint256 indexed agentId, address indexed clientAddress, uint64 feedbackIndex, address indexed responder, string responseURI, bytes32 responseHash)
chains:
  - id: 10143 # Monad Testnet — HyperSync-backed, no paid RPC required
    # Pin the HyperSync source explicitly: without it some hosted deployments
    # stall silently on the RPC fallback (no rpc configured) at block -1.
    hypersync_config:
      url: "https://monad-testnet.hypersync.xyz"
    # Earliest indexed event on any contract is IdentityRegistry.Registered at
    # block 10,391,697 (found via HyperSync first-log scan). Start just below it:
    # faster sync, and this start_block feeds the web's coverage check, so it
    # must stay at or below the earliest block that can contain indexed events.
    start_block: 10391600
    contracts:
      - name: CredentialRegistry
        # v2 registry (ERC-1271 issuer path). First on-chain event at 67,367,641.
        address: "0xf589013b0D41efBdb25b8BDF98c83d676B02aF5a"
        start_block: 67367000
      - name: IdentityRegistry
        address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
        start_block: 10391600
      - name: ReputationRegistry
        address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
        start_block: 10391600
